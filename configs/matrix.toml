# Agility matrix: one-factor-at-a-time from the C3 baseline (hybrid KEM,
# dual signature, hkdf-sha256, aes-256-gcm).
#
# Design rules (§7 C4, §4):
#   - Each KEM entry replaces the entire KEM combiner (not just the PQC half).
#   - Each SIG entry replaces the entire signature combiner (not just the PQC half).
#   - suite_ids are unique; all must appear in both sides' allowed_suite_ids.
#   - Experimental entries (hqc-3, falcon-512) are reported but never skipped.
#
# Suite IDs in use: 1 (classical/C1), 2 (pqc/C2), 3 (hybrid/C3), 10–21 (matrix).

[[entries]]
entry_id    = "base"
suite_id    = 3
description = "C3 baseline: hybrid KEM + dual signature + SHA-256 KDF + AES-256-GCM"
toml        = "configs/suites/matrix/base.toml"
factor      = "baseline"
experimental = false

[[entries]]
entry_id    = "k-512"
suite_id    = 10
description = "KEM swap: standalone ML-KEM-512 (replaces full hybrid)"
toml        = "configs/suites/matrix/k-512.toml"
factor      = "kem"
experimental = false

